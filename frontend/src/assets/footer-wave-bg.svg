<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid slice">
  <defs>

    <!-- Base dark teal background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c5a52"/>
      <stop offset="100%" stop-color="#0a4f48"/>
    </linearGradient>

    <!-- Wave 1 (back/top bright layer) gradient -->
    <linearGradient id="w1Grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1ecfb5" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#12a090" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0c7a6e" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Wave 2 (front layer) gradient -->
    <linearGradient id="w2Grad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0f9e8c" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0b7a6c" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0a5f55" stop-opacity="1"/>
    </linearGradient>

    <!-- Subtle top glow filter -->
    <filter id="topGlow" x="-2%" y="-10%" width="104%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient glow -->
    <radialGradient id="ambientGlow" cx="65%" cy="18%" r="38%">
      <stop offset="0%" stop-color="#1ecfb5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a5f55" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Background -->
  <rect width="1440" height="560" fill="url(#bgGrad)"/>

  <!-- Wave 1: back bright layer -->
  <path
    d="M0,0 L0,115 C80,95 200,175 370,135 C530,98 660,185 820,148 C980,112 1120,168 1280,115 C1360,90 1410,70 1440,62 L1440,0 Z"
    fill="url(#w1Grad)"
    filter="url(#topGlow)"
  />

  <!-- Cyan highlight line along wave 1 top edge -->
  <path
    d="M0,115 C80,95 200,175 370,135 C530,98 660,185 820,148 C980,112 1120,168 1280,115 C1360,90 1410,70 1440,62"
    fill="none"
    stroke="#4dfff0"
    stroke-width="1.8"
    stroke-opacity="0.35"
  />

  <!-- Wave 2: front layer -->
  <path
    d="M0,0 L0,165 C110,140 260,230 460,190 C650,152 780,240 980,200 C1150,165 1300,215 1440,175 L1440,0 Z"
    fill="url(#w2Grad)"
  />

  <!-- Glow line along wave 2 top edge -->
  <path
    d="M0,165 C110,140 260,230 460,190 C650,152 780,240 980,200 C1150,165 1300,215 1440,175"
    fill="none"
    stroke="#2de8d0"
    stroke-width="1.4"
    stroke-opacity="0.28"
  />

  <!-- Ambient radial glow overlay -->
  <rect width="1440" height="560" fill="url(#ambientGlow)"/>

</svg>
